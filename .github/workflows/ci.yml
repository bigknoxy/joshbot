name: CI

on:
  # Every pull request, not only those targeting main. A stacked PR based on
  # another branch got no CI at all, so the whole middle of a stack merged on
  # local verification alone.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Build
        run: go build ./cmd/joshbot

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          if [ "$(echo "${TOTAL} < 45" | bc -l)" = "1" ]; then
            echo "FAIL: Total coverage ${TOTAL}% is below 45% threshold"
            exit 1
          fi
          echo "PASS: Total coverage ${TOTAL}% meets 45% threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"

          # Determine badge color based on coverage
          if [ "$(echo "${TOTAL} >= 80" | bc -l)" = "1" ]; then
            COLOR="green"
          elif [ "$(echo "${TOTAL} >= 60" | bc -l)" = "1" ]; then
            COLOR="yellowgreen"
          elif [ "$(echo "${TOTAL} >= 45" | bc -l)" = "1" ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          # Generate badge SVG and save to repo
          curl -s "https://img.shields.io/badge/coverage-${TOTAL}%25-${COLOR}" > docs/coverage-badge.svg

          # Commit if changed
          if [ -n "$(git status --porcelain docs/coverage-badge.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/coverage-badge.svg
            git commit -m "ci: update coverage badge to ${TOTAL}%" || echo "No changes to commit"
            git push
          else
            echo "Coverage badge is up to date"
          fi

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: .
