name: Security

# Runs alongside CI on every PR and push to main. Four independent, free
# scanners chosen for this repo's actual attack surface (shell tool, MCP,
# filesystem containment, credential handling) rather than a generic
# checklist:
#   - govulncheck: known CVEs in dependencies, call-graph aware so it only
#     flags vulnerabilities actually reachable from this code
#   - gosec: Go-specific static analysis (hardcoded creds, weak crypto,
#     command injection, unsafe file perms)
#   - CodeQL: semantic taint analysis (path traversal, command/SQL
#     injection, SSRF) — free for public repos
#   - gitleaks: scans commits/diffs for leaked secrets, complementing
#     internal/redact (which only protects runtime output, not what a
#     contributor commits)
#
# CodeQL and gitleaks block (no continue-on-error): a clean run against
# this codebase found nothing, so a future finding in either is a real
# regression and should turn the check red.
#
# govulncheck blocks too: with the Go toolchain bump in this PR (setup-go
# resolves 'go-version: 1.25' to the latest 1.25.x patch automatically),
# it reports 0 vulnerabilities against this codebase's current
# dependencies. It will go red again the moment a real one appears —
# that's the point.
#
# gosec stays `continue-on-error: true`, and unlike the other three this
# is NOT because it's clean — running it for the first time surfaced 150
# findings across the shell tool, sandbox, and service-install code (G204
# subprocess launches, G101 possible hardcoded credentials, G404 weak
# random, and more). Many are almost certainly intentional given what this
# codebase does on purpose (the shell tool exists to launch subprocesses),
# but that call has to be made file by file, not assumed. Flipping this to
# blocking before that triage happens would either permanently redden
# every PR or invite a blanket #nosec pass that hides real findings later.
# Tracked in issue #358; revisit once triaged.
#
# Third-party actions are pinned to a commit SHA, not a mutable tag —
# `securego/gosec@master` in particular would run whatever lands on that
# branch next, unreviewed.
#
# NOTE: a red job here only shows on the PR checks list — GitHub does not
# refuse the merge unless these are added as required status checks in
# branch protection (main currently has none configured). That is a
# separate, admin-level repo-settings change.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed CVE in an existing dependency surfaces
    # even on a week with no code changes. govulncheck's DB updates
    # independently of this repo's commits.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif -exclude-dir=.git ./...'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gosec-results.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:go'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
