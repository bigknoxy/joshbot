name: Security

# Runs alongside CI on every PR and push to main. Four independent, free
# scanners chosen for this repo's actual attack surface (shell tool, MCP,
# filesystem containment, credential handling) rather than a generic
# checklist:
#   - govulncheck: known CVEs in dependencies, call-graph aware so it only
#     flags vulnerabilities actually reachable from this code
#   - gosec: Go-specific static analysis (hardcoded creds, weak crypto,
#     command injection, unsafe file perms)
#   - CodeQL: semantic taint analysis (path traversal, command/SQL
#     injection, SSRF) — free for public repos
#   - gitleaks: scans commits/diffs for leaked secrets, complementing
#     internal/redact (which only protects runtime output, not what a
#     contributor commits)
#
# gosec, CodeQL and gitleaks block (no continue-on-error): a clean run
# against this codebase found nothing, so a future finding in any of them
# is a real regression and should turn the check red.
#
# govulncheck stays `continue-on-error: true` — not because its findings
# don't matter, but because 11 of them cannot be fixed by this repo at all
# right now. The two real dependency CVEs (gorilla/websocket, x/text) and
# every stdlib CVE fixed by Go 1.25.9 were resolved by the dependency bump
# in this same PR; the remaining 11 are stdlib CVEs fixed only in Go
# 1.25.10 through 1.25.13, which do not exist yet (latest real Go release
# is 1.25.9, checked against go.dev). Flipping this job to blocking today
# would permanently redden every PR with no fix available. Revisit once Go
# ships those patches — the weekly schedule below re-surfaces this
# automatically, and CLAUDE.md / AGENTS.md pre-release checklists call out
# checking the Security tab in the meantime.
#
# Third-party actions are pinned to a commit SHA, not a mutable tag —
# `securego/gosec@master` in particular would run whatever lands on that
# branch next, unreviewed.
#
# NOTE: a red job here only shows on the PR checks list — GitHub does not
# refuse the merge unless these are added as required status checks in
# branch protection (main currently has none configured). That is a
# separate, admin-level repo-settings change.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed CVE in an existing dependency surfaces
    # even on a week with no code changes. govulncheck's DB updates
    # independently of this repo's commits.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-fmt sarif -out gosec-results.sarif -exclude-dir=.git ./...'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gosec-results.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:go'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
