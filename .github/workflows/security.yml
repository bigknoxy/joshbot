name: Security

# Migrated to the org-wide reusable security workflow
# (bigknoxy/.github/.github/workflows/security-reusable.yml), which now
# provides gitleaks, dependency-review (PRs only), CodeQL, and
# govulncheck (language=go) plus trivy-fs/trivy-image (has_docker=true).
#
# gosec is kept as a separate job below, unchanged from the previous
# version of this file: the reusable workflow only runs govulncheck for
# go, not gosec, so it is not covered and must stay local. See its
# extensive inline comments for the exclude-list rationale — those
# findings were triaged in issue #358 and are unrelated to this
# migration.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed CVE in an existing dependency surfaces
    # even on a week with no code changes. govulncheck's DB updates
    # independently of this repo's commits.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security:
    uses: bigknoxy/.github/.github/workflows/security-reusable.yml@main
    with:
      language: go
      has_docker: true
      dockerfile: Dockerfile
      docker_context: .
    secrets: inherit

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gosec
        # -no-fail: this gosec version's own exit code does not reliably
        # reflect the SARIF result count (confirmed empirically: it exits
        # non-zero even with zero results under -fmt sarif) — the "Check for
        # findings" step below is the actual pass/fail gate, reading the
        # SARIF file directly rather than trusting the tool's exit code.
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-no-fail -exclude=G101,G104,G117,G118,G124,G204,G304,G404,G703 -fmt sarif -out gosec-results.sarif -exclude-dir=.git ./...'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gosec-results.sarif
      - name: Check for findings
        run: |
          python3 -c "
          import json
          d = json.load(open('gosec-results.sarif'))
          results = d['runs'][0].get('results', [])
          print(f'gosec findings after exclusions: {len(results)}')
          for r in results:
              loc = r.get('locations', [{}])[0].get('physicalLocation', {})
              path = loc.get('artifactLocation', {}).get('uri', '?')
              line = loc.get('region', {}).get('startLine', '?')
              print(f'  {r.get(\"ruleId\")} {path}:{line} {r.get(\"message\", {}).get(\"text\", \"\")}')
          import sys
          sys.exit(1 if results else 0)
          "
