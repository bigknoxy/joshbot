      - generic [ref=e110]: Patterns
      - heading "Key Architectural Patterns" [level=2] [ref=e111]
      - paragraph [ref=e112]: These design decisions shape how every component works.
      - generic [ref=e113]:
        - generic [ref=e114]:
          - heading "Message Bus" [level=4] [ref=e115]
          - paragraph [ref=e116]:
            - text: Channels decoupled from agent via
            - code [ref=e117]: chan InboundMessage
            - text: and
            - code [ref=e118]: chan OutboundMessage
            - text: . Adding a new channel requires zero agent changes.
        - generic [ref=e119]:
          - heading "ReAct Loop" [level=4] [ref=e120]
          - paragraph [ref=e121]: LLM → tools → reflect → repeat (max 20 iterations). Each iteration appends tool results as observations for the next LLM call.
        - generic [ref=e122]:
          - heading "Plain-File Storage" [level=4] [ref=e123]
          - paragraph [ref=e124]: No databases. MEMORY.md, HISTORY.md, SKILL.md files. Portable, auditable, grep-able, syncs via Dropbox/git.
        - generic [ref=e125]:
          - heading "Progressive Skill Loading" [level=4] [ref=e126]
          - paragraph [ref=e127]: Skills summarized in context; full content loaded on demand. Keeps token overhead minimal until a skill is actually invoked.
        - generic [ref=e128]:
          - heading "Prompt Caching" [level=4] [ref=e129]
          - paragraph [ref=e130]: Static system prompt segments cached with mtime-based invalidation. Reduces file I/O on every message — critical for memory/skill files read each turn.
        - generic [ref=e131]:
          - heading "Model-Centric Config" [level=4] [ref=e132]
          - paragraph [ref=e133]: Provider auto-detected from model prefix (claude → Anthropic, gpt → OpenAI). Fallback chains for resilience. ExtraBody support for provider-specific fields.
        - generic [ref=e134]:
          - heading "Context Compression" [level=4] [ref=e135]
          - paragraph [ref=e136]: Conversation history summarized when approaching token limits. Budget manager tracks and enforces per-iteration costs.
        - generic [ref=e137]:
          - heading "Subagent Delegation" [level=4] [ref=e138]
          - paragraph [ref=e139]: Parallel fan-out or sequential chain execution. Each subagent gets a focused one-turn LLM call with its own system prompt. Results merged back into the parent agent context.
