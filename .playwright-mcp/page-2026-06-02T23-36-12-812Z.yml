      - heading "Agent (internal/agent/)" [level=3] [ref=e143]:
        - text: Agent (
        - code [ref=e144]: internal/agent/
        - text: )
      - paragraph [ref=e145]: The core ReAct loop. Each message triggers up to 20 think-act-observe iterations. System prompt is assembled from identity files + memory + skills summaries (with mtime-based caching). The agent serializes the tool schema from the Registry into the LLM's function calling format.
      - heading "Tools (internal/tools/)" [level=3] [ref=e146]:
        - text: Tools (
        - code [ref=e147]: internal/tools/
        - text: )
      - paragraph [ref=e148]:
        - text: 20 tools implement the
        - code [ref=e149]: Tool
        - text: "interface. Each declares Name, Description, Parameters, and Execute. The Registry handles discovery and execution. Tools include: filesystem, shell (with safety deny-list), web fetch (SSRF-protected), memory search, skill management, parallel subagent, chain execution, message sending, and more."
      - heading "Memory System (internal/memory/)" [level=3] [ref=e150]:
        - text: Memory System (
        - code [ref=e151]: internal/memory/
        - text: )
      - paragraph [ref=e152]:
        - text: "Two files:"
        - code [ref=e153]: MEMORY.md
        - text: (always in context — key facts, preferences, decisions) and
        - code [ref=e154]: HISTORY.md
        - text: (grep-searchable event log for recall). Facts are extracted after each conversation turn by the learning module.
      - heading "Skills System (internal/skills/)" [level=3] [ref=e155]:
        - text: Skills System (
        - code [ref=e156]: internal/skills/
        - text: )
      - paragraph [ref=e157]:
        - text: Markdown files with YAML frontmatter in
        - code [ref=e158]: "workspace/skills/{name}/SKILL.md"
        - text: ". Auto-discovered on startup. Progressive loading: summary only in system prompt, full content loaded when the skill is invoked. The detection module observes tool usage patterns and auto-creates skills."
      - heading "Providers (internal/providers/)" [level=3] [ref=e159]:
        - text: Providers (
        - code [ref=e160]: internal/providers/
        - text: )
      - paragraph [ref=e161]:
        - text: Multi-provider LLM support via a unified
        - code [ref=e162]: Provider
        - text: "interface. Registered providers: OpenRouter, OpenAI, NVIDIA, Groq, Ollama, Anthropic, Poolside, Azure, Custom, LiteLLM. Provider auto-selection by model prefix. ExtraBody support for provider-specific fields (e.g., poolside's chat_template_kwargs)."
      - heading "Message Bus (internal/bus/)" [level=3] [ref=e163]:
        - text: Message Bus (
        - code [ref=e164]: internal/bus/
        - text: )
      - paragraph [ref=e165]: Goroutine-safe channel multiplexer. Inbound messages from any channel are routed to the agent goroutine. Outbound messages from the agent are routed back to the originating channel. This decoupling means channels and agent can be developed independently.
